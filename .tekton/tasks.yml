apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  workspaces:
    - name: source
  steps:
    - name: remove
      image: alpine:3.18
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        rm -rf ./*
        rm -rf ./.??*

---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: nose
spec:
  workspaces:
    - name: source
  steps:
    - name: run-tests
      image: python:3.8
      workingDir: $(workspaces.source.path)
      script: |
        pip install -r requirements.txt
        pip install nose pinocchio
        nosetests -v --with-spec --spec-color
